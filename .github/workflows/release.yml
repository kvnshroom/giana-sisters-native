name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  # SDL 2 (built from source for the static Windows/macOS builds) still declares an old CMake minimum, which CMake 4 refuses
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CARGO_TERM_COLOR: always
jobs:
  # The release is created first, without packages; every system uploads its package as soon as it is built, so Linux
  # and Windows do not wait for a slow macOS runner. The game offers an update only once the package for its own system
  # and SHA256SUMS.txt are there (update.rs, Release::has_package).
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/giana-app/Cargo.toml | head -1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match crates/giana-app/Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?([ ]|$)" { on=1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $version" >&2; exit 1; }
      - name: Create the GitHub release (packages follow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists (a re-run)"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi

  build-linux:
    needs: release
    uses: ./.github/workflows/build-package.yml
    with: { kind: linux, os: ubuntu-22.04 }

  upload-linux:
    # only this small job can write to the release: it uploads the package built read-only above
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist
      - name: Upload the package and refresh SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/giana-sisters-native-* --clobber
          # the checksum file lists every package uploaded so far; two uploads at once may each miss the other's
          # line, the `checksums` job at the end writes the complete file
          mkdir sums && cd sums
          gh release download "$GITHUB_REF_NAME" -p 'giana-sisters-native-*'
          sha256sum giana-sisters-native-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber

  build-windows:
    needs: release
    uses: ./.github/workflows/build-package.yml
    with: { kind: windows, os: windows-latest }

  upload-windows:
    # only this small job can write to the release: it uploads the package built read-only above
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist
      - name: Upload the package and refresh SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/giana-sisters-native-* --clobber
          # the checksum file lists every package uploaded so far; two uploads at once may each miss the other's
          # line, the `checksums` job at the end writes the complete file
          mkdir sums && cd sums
          gh release download "$GITHUB_REF_NAME" -p 'giana-sisters-native-*'
          sha256sum giana-sisters-native-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber

  build-macos:
    needs: release
    uses: ./.github/workflows/build-package.yml
    with: { kind: macos, os: macos-latest }

  upload-macos:
    # only this small job can write to the release: it uploads the package built read-only above
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist
      - name: Upload the package and refresh SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/giana-sisters-native-* --clobber
          # the checksum file lists every package uploaded so far; two uploads at once may each miss the other's
          # line, the `checksums` job at the end writes the complete file
          mkdir sums && cd sums
          gh release download "$GITHUB_REF_NAME" -p 'giana-sisters-native-*'
          sha256sum giana-sisters-native-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber

  checksums:
    # after all uploads, also when one failed: the final checksum file from the packages that are really there
    needs: [upload-linux, upload-windows, upload-macos]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS.txt from the uploaded packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir sums && cd sums
          gh release download "$GITHUB_REF_NAME" -p 'giana-sisters-native-*'
          ls -l
          sha256sum giana-sisters-native-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
