[workspace]
resolver = "2"
members = [
    "crates/giana-core",
    "crates/giana-render",
    "crates/giana-audio",
    "crates/giana-app",
    "crates/giana-extract",
    "crates/giana-module",
    "crates/giana-engine-b",
    "crates/giana-engine-c",
    "crates/giana-c30-oracle",
    "crates/giana-authentic",
]

[workspace.lints.clippy]
# Index-heavy, address-mirroring 6502/VIC port code: these style lints do not fit.
needless_range_loop = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
new_without_default = "allow"
field_reassign_with_default = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
