[package]
name = "giana-app"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "giana_app"
path = "src/lib.rs"

[[bin]]
name = "giana-app"
path = "src/main.rs"

[dependencies]
giana-core = { path = "../giana-core" }
giana-render = { path = "../giana-render" }
giana-audio = { path = "../giana-audio" }
giana-extract = { path = "../giana-extract" }
sdl2 = "0.38.0"
# native file dialog; on Linux through the desktop portal (no GTK needed at build or run time)
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sha2 = "0.11.1"
serde_json = "1.0.154"
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Builds SDL2 from source into the program, so that the player's computer needs no SDL2 (for the release packages)
bundled-sdl = ["sdl2/bundled", "sdl2/static-link"]
